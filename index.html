<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balikan Lagi Yuk 🥺</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hujan hati -->
  <div class="hearts-bg" id="heartsBg"></div>

  <main class="card">
    <div class="bear">🧸</div>
    <h1 class="title">Hai Najwa... Aku Mau Ngomong 🥺</h1>

    <p class="message" id="message"></p>

    <div class="buttons" id="buttons">
      <button class="btn btn-yes" id="btnYes">Iya, balikan 🥰</button>
      <button class="btn btn-no" id="btnNo">Enggak 😤</button>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <!-- Overlay rayakan -->
  <div class="overlay" id="overlay">
    <div class="overlay-box">
      <div class="big-emoji">🥳💖</div>
      <h2>YEAYYY! Makasih!</h2>
      <p>Aku janji bakal jadi lebih baik, gak ngambek-ngambek lagi. Nanti aku turutin kamu yaaa🍜</p>
      <p class="small">(peluk dulu dari jauh 🤗)</p>
      <button class="btn btn-again" id="btnAgain">Ulangi lagi 🔁</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
